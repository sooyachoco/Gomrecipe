<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f6f1e8"><title>곰지연을 위한 레시피 노트</title><link rel="stylesheet" href="/styles.css"></head><body><div class="app"><section id="home" class="screen active"><div class="top"><div class="header-row"><a href="https://sooyachoco.github.io/Gomlife/" class="home-btn" aria-label="홈으로"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 0 2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></a><div><div class="eyebrow">made with love, for 곰지연</div><h1>곰지연을 위한 레시피 노트</h1></div><div class="admin-area"><button id="loginBtn" class="admin-link hidden">관리자 로그인</button><button id="logoutBtn" class="admin-link hidden">로그아웃</button></div></div><div class="character-banner" aria-hidden="true"><img src="/assets/recipe-header.svg" alt=""></div><div id="tabs" class="tabs"></div></div><div class="content"><div id="loading" class="state-card">레시피를 불러오는 중이에요…</div><div id="recipeList" class="list"></div><div id="empty" class="empty hidden"><div class="icon">🍽️</div><h2>아직 기록된 레시피가 없어요</h2><p>직접 만든 요리와 기억해두고 싶은 레시피를<br>사진과 함께 차곡차곡 모아보세요.</p></div></div><button id="addBtn" class="fab hidden">＋ 새 레시피 작성</button></section><section id="detail" class="screen"><div class="detail-top"><button class="icon-btn" id="backFromDetail" aria-label="뒤로">‹</button><div class="top-title">레시피</div><button class="icon-btn hidden" id="editBtn" aria-label="수정">✎</button><span id="editSpacer" class="icon-spacer"></span></div><div class="detail-wrap"><div id="detailHero" class="hero">썸네일 없음</div><div id="detailCat" class="detail-cat"></div><h2 id="detailTitle" class="detail-title"></h2><div class="section"><h4>재료</h4><div id="detailIngredients" class="body"></div></div><div class="section"><h4>만드는 법</h4><div id="detailSteps" class="body"></div></div></div></section><section id="edit" class="screen"><div class="edit-top"><button class="icon-btn" id="backFromEdit" aria-label="뒤로">‹</button><div class="top-title" id="editHeading">새 레시피</div><button id="deleteBtn" class="small-link hidden">삭제</button></div><div class="edit-wrap"><div class="field upload"><label>썸네일</label><div id="preview" class="preview">사진을 올려주세요</div><input type="file" id="imageInput" accept="image/*"><button type="button" id="removeImageBtn" class="text-btn hidden">사진 제거</button></div><div class="field"><label>카테고리</label><select id="categoryInput"><option>한식</option><option>양식</option><option>중식</option><option>기타</option></select></div><div class="field"><label>제목</label><input id="titleInput" type="text" maxlength="120" placeholder="예: 엄마표 된장찌개"></div><div class="field"><label>재료</label><textarea id="ingredientsInput" placeholder="한 줄에 하나씩 적어도 좋아요"></textarea></div><div class="field"><label>만드는 법</label><textarea id="stepsInput" placeholder="순서대로 차분히 기록해보세요"></textarea></div></div><div class="savebar"><button id="cancelBtn" class="btn secondary">취소</button><button id="saveBtn" class="btn primary">저장</button></div></section></div><div id="loginModal" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-card"><div class="modal-kicker">for owner only</div><h2>관리자 로그인</h2><p>레시피를 작성하거나 수정할 때만 로그인해주세요.</p><input id="passwordInput" type="password" autocomplete="current-password" placeholder="관리자 비밀번호"><div id="loginError" class="error-text"></div><div class="modal-actions"><button id="closeLoginBtn" class="btn secondary">취소</button><button id="submitLoginBtn" class="btn primary">로그인</button></div></div></div><div id="toast" class="toast hidden"></div><script src="/app.js" defer></script></body></html>
